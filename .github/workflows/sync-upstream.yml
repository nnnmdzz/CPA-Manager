name: Sync upstream and merge to custom

on:
  schedule:
    - cron: "0 8-23/3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/seakee/CPA-Manager.git
          git fetch upstream main
          git fetch origin main custom

      - name: Sync main with upstream/main
        id: sync_main
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse upstream/main)" ]; then
            echo "main already at upstream/main; nothing to push"
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git reset --hard upstream/main
          git push origin main --force-with-lease
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Merge main into custom
        id: merge_custom
        run: |
          set -euo pipefail
          git checkout -B custom origin/custom
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "custom already contains origin/main; nothing to merge"
            echo "status=noop" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge --no-edit origin/main; then
            git push origin custom
            echo "status=clean" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            echo "::warning::Merge conflict between origin/main and custom; opening PR for manual resolution."
            echo "status=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Open conflict PR
        if: steps.merge_custom.outputs.status == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          UPSTREAM_SHA="$(git rev-parse upstream/main)"
          SHORT="${UPSTREAM_SHA:0:7}"
          BRANCH="auto/sync-${SHORT}"
          EXISTING="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' || true)"
          if [ -n "$EXISTING" ]; then
            echo "Conflict PR already open for $BRANCH (#$EXISTING)."
            exit 0
          fi
          git checkout -B "$BRANCH" origin/custom
          git merge --no-edit --no-ff origin/main || true
          git add -A
          git -c core.editor=true commit --no-verify \
              -m "chore(sync): unresolved conflicts from upstream ${SHORT}" || true
          git push origin "$BRANCH"
          gh pr create \
            --base custom \
            --head "$BRANCH" \
            --title "Auto-sync conflict: upstream/main -> custom (${SHORT})" \
            --body "Hourly sync pulled new upstream commits, but merging into \`custom\` produced conflicts.

          - Upstream HEAD: \`${UPSTREAM_SHA}\`
          - Files with conflict markers are committed for visibility.
          - **Resolution**: pull this branch, fix conflicts, push, then merge this PR. Or resolve in the GitHub web editor and merge.

          Future hourly runs will skip while this PR is open (branch name is keyed by upstream SHA)."

      - name: Trigger Docker build on custom
        if: steps.merge_custom.outputs.status == 'clean'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run docker.yml --ref custom
          echo "Dispatched 'Build and Push Docker Image' on custom."

      - name: Summary
        if: always()
        run: |
          {
            echo "### Sync result"
            echo "- main updated: ${{ steps.sync_main.outputs.updated || 'n/a' }}"
            echo "- custom status: ${{ steps.merge_custom.outputs.status || 'skipped' }}"
          } >> "$GITHUB_STEP_SUMMARY"
